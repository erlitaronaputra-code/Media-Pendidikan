<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etalase Projek Pembelajaran Peserta</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            padding: 40px 20px;
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.15);
        }

        header h1 {
            font-size: 2.4rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            color: #e0e7ff;
            font-size: 1.1rem;
        }

        .site-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: #ffffff;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--primary);
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            box-sizing: border-box;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #f8fafc;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }

        button.btn-submit {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            width: 100%;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4, #10b981);
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            margin-bottom: 12px;
            margin-top: 5px;
        }
        .badge-digital { background: #e0f2fe; color: #0284c7; }
        .badge-video { background: #fee2e2; color: #dc2626; }
        .badge-infografis { background: #fef3c7; color: #d97706; }

        .project-card h3 {
            font-size: 1.15rem;
            margin: 0 0 6px 0;
            color: var(--text-main);
        }

        .media-container {
            width: 100%;
            height: 180px;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .media-container iframe, .media-container img {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        .btn-link-demo {
            display: block;
            padding: 12px;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            text-align: center;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
            transition: opacity 0.2s;
        }

        .btn-link-demo:hover {
            opacity: 0.9;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: auto;
        }

        .btn-like {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #d1fae5;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ Etalase Karya Peserta</h1>
        <p>Pusat pameran digital karya kreatif dan media pembelajaran kelompok.</p>
    </header>

    <!-- Tombol Navigasi Tab -->
    <div class="site-nav">
        <button class="tab-btn active" onclick="switchView('galeri', this)">🖼️ Lihat Galeri Karya</button>
        <button class="tab-btn" onclick="switchView('upload', this)">📤 Form Upload Peserta</button>
    </div>

    <!-- PILIHAN 1: MODE GALERI KARTU -->
    <div id="view-galeri" class="view-section active">
        <h2 style="text-align:center; margin-bottom:20px;">Daftar Karya Terpilih</h2>
        
        <!-- Kolom Pencarian -->
        <div style="max-width: 400px; margin: 0 auto 25px auto;">
            <input type="text" id="searchInput" placeholder="🔍 Cari nama kelompok atau judul projek..." onkeyup="filterProjects()" style="padding: 12px 16px; border-radius: 30px; border: 2px solid var(--border-color); width: 100%; font-size: 0.95rem; background: #ffffff;">
        </div>

        <div id="projectContainer" class="project-grid">
            <p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">Memuat karya...</p>
        </div>
    </div>

    <!-- PILIHAN 2: FORM UPLOAD PESERTA -->
    <div id="view-upload" class="view-section">
        <div class="card">
            <h2>📤 Form Pengumpulan Tugas Kelompok</h2>
            <form id="projekForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nama Kelompok</label>
                        <input type="text" id="namaKelompok" required placeholder="Contoh: Kelompok 1 - Melati">
                    </div>
                    <div class="form-group">
                        <label>Judul Projek / Produk</label>
                        <input type="text" id="judul" required placeholder="Contoh: Media Tata Surya Interaktif">
                    </div>
                    <div class="form-group">
                        <label>Kategori Media</label>
                        <select id="kategori">
                            <option value="Media Digital">Media Digital / Web</option>
                            <option value="Video Pembelajaran">Video Pembelajaran</option>
                            <option value="Infografis">Infografis / Gambar</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label>Link Tautan Karya (YouTube / Drive / Canva / Web / HTML)</label>
                        <input type="url" id="linkFile" required placeholder="https://...">
                    </div>
                    <div class="form-group full-width">
                        <button type="submit" id="btnSubmit" class="btn-submit">Kirim Projek ke Guru 🚀</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGpib18ijFDXAHSMkhkK8jDBYJEhP4EDO94sro4ZSiQMPYbXl0yy29tIQhbVTERxXbaw/exec";
        let allProjectsData = [];

        function switchView(viewName, element) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById('view-' + viewName).classList.add('active');
            if (element) {
                element.classList.add('active');
            }
        }

        document.getElementById('projekForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Mengirim...";
            btn.disabled = true;

            const data = {
                action: "submitProjek",
                namaKelompok: document.getElementById('namaKelompok').value,
                judul: document.getElementById('judul').value,
                kategori: document.getElementById('kategori').value,
                linkFile: document.getElementById('linkFile').value
            };

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(result => {
                alert(result.message);
                document.getElementById('projekForm').reset();
                btn.innerText = "Kirim Projek ke Guru 🚀";
                btn.disabled = false;
            })
            .catch(err => {
                alert("Gagal mengirim data.");
                btn.innerText = "Kirim Projek ke Guru 🚀";
                btn.disabled = false;
            });
        });

        function renderMediaEmbed(url) {
            if (url.includes('youtube.com') || url.includes('youtu.be')) {
                let videoId = '';
                if (url.includes('youtu.be/')) {
                    videoId = url.split('youtu.be/')[1].split('?')[0];
                } else if (url.includes('watch?v=')) {
                    videoId = url.split('watch?v=')[1].split('&')[0];
                }
                if (videoId) {
                    return `<div class="media-container"><iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe></div>`;
                }
            } else if (url.match(/\.(jpeg|jpg|png|gif)$/i)) {
                return `<div class="media-container"><img src="${url}" alt="Preview Karya"></div>`;
            }
            return `<a href="${url}" target="_blank" class="btn-link-demo">🎮 Buka & Operasikan Media Interaktif</a>`;
        }

        function displayProjects(dataArray) {
            const container = document.getElementById('projectContainer');
            container.innerHTML = "";
            if (!dataArray || dataArray.length === 0) {
                container.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">Tidak ada karya yang ditemukan.</p>`;
                return;
            }
            dataArray.forEach(p => {
                let badgeClass = 'badge-digital';
                if (p.kategori === 'Video Pembelajaran') badgeClass = 'badge-video';
                if (p.kategori === 'Infografis') badgeClass = 'badge-infografis';

                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div>
                        <span class="badge ${badgeClass}">${p.kategori}</span>
                        <h3>${p.judul}</h3>
                        <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;"><b>Kelompok:</b> ${p.namaKelompok}</p>
                        ${renderMediaEmbed(p.linkFile)}
                    </div>
                    <div class="card-footer">
                        <button class="btn-like" onclick="likeProject('${p.id}')">👍 Suka (${p.likes})</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function loadProjects() {
            fetch(SCRIPT_URL + "?action=getPublicProjects")
            .then(res => res.json())
            .then(data => {
                allProjectsData = data || [];
                displayProjects(allProjectsData);
            })
            .catch(err => {
                const container = document.getElementById('projectContainer');
                container.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">Gagal memuat data galeri.</p>`;
            });
        }

        function filterProjects() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProjectsData.filter(p => 
                p.namaKelompok.toLowerCase().includes(keyword) || 
                p.judul.toLowerCase().includes(keyword)
            );
            displayProjects(filtered);
        }

        function likeProject(id) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "addLike", id: id })
            }).then(() => loadProjects());
        }

        loadProjects();
    </script>
</body>
</html>
