<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etalase Projek Pembelajaran Siswa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.2rem;
            color: var(--primary);
            margin-bottom: 8px;
            font-weight: 700;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.05rem;
        }

        /* Navigasi Tab Sederhana (2 Pilihan) */
        .site-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .tab-btn {
            background: #e2e8f0;
            color: var(--text-main);
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 14px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
            background-color: #fdfdfd;
        }

        button.btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .project-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .badge {
            background: #eef2ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 12px;
        }

        .media-container {
            width: 100%;
            height: 180px;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }

        .media-container iframe, .media-container img {
            width: 100%;
            height: 100%;
            border: none;
            object-fit: cover;
        }

        .btn-link-demo {
            display: block;
            padding: 10px;
            background: #f1f5f9;
            color: var(--primary);
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 12px;
            margin-top: auto;
        }

        .btn-like {
            background: #ecfdf5;
            color: #059669;
            border: 1px solid #d1fae5;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>✨ Etalase Karya Siswa</h1>
        <p>Pusat pameran digital karya kreatif dan media pembelajaran kelompok.</p>
    </header>

    <!-- Tombol Pilihan Tampilan (2 Menu Utama) -->
    <div class="site-nav">
        <button class="tab-btn active" onclick="switchView('galeri')">🖼️ Lihat Galeri Karya</button>
        <button class="tab-btn" onclick="switchView('upload')">📤 Form Upload Siswa</button>
    </div>

    <!-- PILIHAN 1: MODE GALERI KARTU -->
    <div id="view-galeri" class="view-section active">
        <h2 style="text-align:center; margin-bottom:20px;">Daftar Karya Terpilih</h2>
        <div id="projectContainer" class="project-grid">
            <p style="text-align:center; grid-column: 1/-1; color: var(--text-muted);">Memuat karya...</p>
        </div>
    </div>

    <!-- PILIHAN 2: FORM UPLOAD SISWA -->
