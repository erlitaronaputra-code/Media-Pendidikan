<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etalase Projek Pembelajaran Siswa</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 20px auto; padding: 20px; background: #f8f9fa; color: #333; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .project-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; }
        .badge { background: #e3f2fd; color: #0d47a1; padding: 3px 8px; border-radius: 4px; font-size: 12px; display: inline-block; margin-bottom: 8px; }
        .btn-like { background: #28a745; margin-right: 5px; }
        .btn-like:hover { background: #218838; }
        .comment-section { margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; font-size: 13px; }
    </style>
</head>
<body>

    <h1>Etalase Karya Siswa</h1>
    <p style="text-align: center; color: #666;">Platform pameran karya dan media pembelajaran kelompok.</p>

    <!-- Form Upload Siswa -->
    <div class="card">
        <h2>Form Pengumpulan Tugas Kelompok</h2>
        <form id="projekForm">
            <div class="form-group">
                <label>Nama Kelompok:</label>
                <input type="text" id="namaKelompok" required placeholder="Contoh: Kelompok 1 - Melati">
            </div>
            <div class="form-group">
                <label>Judul Projek:</label>
                <input type="text" id="judul" required placeholder="Contoh: Media Tata Surya Interaktif">
            </div>
            <div class="form-group">
                <label>Kategori:</label>
                <select id="kategori">
                    <option value="Media Digital">Media Digital</option>
                    <option value="Video Pembelajaran">Video Pembelajaran</option>
                    <option value="Infografis">Infografis</option>
                </select>
            </div>
            <div class="form-group">
                <label>Link File / Karya (Google Drive / Canva / YouTube):</label>
                <input type="url" id="linkFile" required placeholder="https://...">
            </div>
            <button type="submit" id="btnSubmit">Kirim Projek</button>
        </form>
    </div>

    <!-- Galeri Projek Publik -->
    <h2>Daftar Karya Terpilih</h2>
    <div id="projectContainer" class="project-grid">
        <p style="text-align:center; grid-column: 1/-1;">Memuat karya...</p>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwsTI6pTy0RB5-Ntf1EdaoJy539KTKfF3SPy26xpzV-DUKxfeEKQaaDW7BKQYp_Bc41tA/exec";

        // Handle Submit Projek
        document.getElementById('projekForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Mengirim...";
            btn.disabled = true;

            const data = {
                action: "submitProjek",
                namaKelompok: document.getElementById('namaKelompok').value,
                judul: document.getElementById('judul').value,
                kategori: document.getElementById('kategori').value,
                linkFile: document.getElementById('linkFile').value
            };

            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) })
            .then(res => res.json())
            .then(result => {
                alert(result.message);
                document.getElementById('projekForm').reset();
                btn.innerText = "Kirim Projek";
                btn.disabled = false;
            })
            .catch(err => {
                alert("Gagal mengirim data.");
                btn.innerText = "Kirim Projek";
                btn.disabled = false;
            });
        });

        // Muat Data Projek Publik
        function loadProjects() {
            fetch(SCRIPT_URL + "?action=getPublicProjects")
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('projectContainer');
                container.innerHTML = "";
                if (data.length === 0) {
                    container.innerHTML = "<p style='text-align:center; grid-column: 1/-1; color: #777;'>Belum ada karya yang disetujui.</p>";
                    return;
                }
                data.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.innerHTML = `
                        <div>
                            <span class="badge">${p.kategori}</span>
                            <h3 style="margin: 5px 0 10px 0;">${p.judul}</h3>
                            <p style="font-size: 14px; color: #555; margin-bottom: 10px;"><b>Kelompok:</b> ${p.namaKelompok}</p>
                            <a href="${p.linkFile}" target="_blank" style="display:inline-block; margin-bottom:15px; color:#007bff; text-decoration:none; font-weight:bold;">🔗 Lihat Karya / Demo</a>
                        </div>
                        <div>
                            <button class="btn-like" onclick="likeProject('${p.id}')">👍 Suka (${p.likes})</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
            });
        }

        function likeProject(id) {
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "addLike", id: id })
            }).then(() => loadProjects());
        }

        // Jalankan saat halaman dibuka
        loadProjects();
    </script>
</body>
</html>
